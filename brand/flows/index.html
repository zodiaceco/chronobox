<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timebox flows</title>
<style>
  body { margin: 0; padding: 40px 20px 80px; background: #f3f3f5; color: #0b0b0c; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
  h2 { font-size: 1.25rem; margin: 48px 0 4px; }
  p { margin: 0; color: #6a6a70; max-width: 70ch; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 18px; align-items: start; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid #e5e5e8; background: #fff; }
  figcaption { margin-top: 10px; font-size: 0.95rem; }
  figcaption b { display: block; }
  figcaption span { color: #6a6a70; }
</style>
</head>
<body>
<main>
  <h1>Timebox, screen by screen</h1>
  <p>Every screen has one idea and one main button. Screens from the running app on a local fork of Ethereum mainnet, at phone width. Some are captured at a smaller scale than others.</p>
  <div class="row">
    <figure><img src="01-welcome.jpg" alt="Welcome"><figcaption><b>Welcome</b><span>One sentence, one button.</span></figcaption></figure>
    <figure><img src="02-connect.jpg" alt="Connect"><figcaption><b>Connect</b><span>A sheet slides up. It says what the wallet will be: the only key.</span></figcaption></figure>
    <figure><img src="03-network.jpg" alt="Create: network"><figcaption><b>Create: network</b><span>One question per screen. Test networks show only in the dev build.</span></figcaption></figure>
    <figure><img src="04-delay.jpg" alt="Create: delay"><figcaption><b>Create: delay</b><span>Three choices and "another length".</span></figcaption></figure>
    <figure><img src="05-promises.jpg" alt="Create: two promises"><figcaption><b>Create: two promises</b><span>Tap each card. Both ticked gives "Good. That is all it takes."</span></figcaption></figure>
    <figure><img src="06-ready.jpg" alt="Create: ready"><figcaption><b>Create: ready</b><span>A short summary and the contribution.</span></figcaption></figure>
    <figure><img src="07-working.jpg" alt="Create: working"><figcaption><b>Create: working</b><span>A checklist that ticks itself off.</span></figcaption></figure>
    <figure><img src="08-done.jpg" alt="Create: done"><figcaption><b>Create: done</b><span>The mark, the promise, and the address to send money to.</span></figcaption></figure>
    <figure><img src="09-home.jpg" alt="Home"><figcaption><b>Home</b><span>After the first Timebox, the list is the start screen.</span></figcaption></figure>
    <figure><img src="10-timebox.jpg" alt="A Timebox"><figcaption><b>A Timebox</b><span>What is inside, one status line, two buttons, what is waiting, and a short list.</span></figcaption></figure>
    <figure><img src="11-withdraw.jpg" alt="Withdraw"><figcaption><b>Withdraw</b><span>The strong message, then one promise to tick.</span></figcaption></figure>
    <figure><img src="12-started.jpg" alt="The wait has started"><figcaption><b>The wait has started</b><span>When to come back, and a calendar reminder.</span></figcaption></figure>
    <figure><img src="13-cancel.jpg" alt="Cancel"><figcaption><b>Cancel</b><span>One sentence: nothing moves.</span></figcaption></figure>
    <figure><img src="14-delay.jpg" alt="Change the delay"><figcaption><b>Change the delay</b><span>Opened from the list.</span></figcaption></figure>
    <figure><img src="15-hand-over.jpg" alt="Hand over to another wallet"><figcaption><b>Hand over to another wallet</b><span>One field and one promise.</span></figcaption></figure>
    <figure><img src="16-checks.jpg" alt="Safety checks"><figcaption><b>Safety checks</b><span>Out of the way until you want to see them.</span></figcaption></figure>
    <figure><img src="17-get-told.jpg" alt="Get told"><figcaption><b>Get told</b><span>Calendar and alerts.</span></figcaption></figure>
    <figure><img src="18-how-it-is-built-1.jpg" alt="How it is built, top"><figcaption><b>How it is built</b><span>Three parts, what the wallet can do. The wallet sentence and the box glyph were refined after this capture.</span></figcaption></figure>
    <figure><img src="19-how-it-is-built-2.jpg" alt="How it is built, bottom"><figcaption><b>How it is built, continued</b><span>The checks, the limits, and how to verify.</span></figcaption></figure>
  </div>
</main>
</body>
</html>
